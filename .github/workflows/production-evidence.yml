name: Offline production evidence

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install declared dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip check
      - name: Offline regression and contract checks
        run: |
          unset OPENAI_API_KEY ANTHROPIC_API_KEY XAI_API_KEY LANGSMITH_API_KEY
          python -m pytest -q -p no:cacheprovider
          python -m ruff check src/cipherloop/core/trajectory.py src/cipherloop/main.py src/cipherloop/executor/compressor.py src/cipherloop/executor/validator.py tests/test_trajectory.py tests/test_compressor.py tests/test_validator.py tests/test_production_contract.py tests/test_production_evidence.py tests/test_sandbox_identity.py scripts/capture_production_smoke.py
          python scripts/capture_production_smoke.py --output "$RUNNER_TEMP/production-evidence"
          git diff --exit-code
