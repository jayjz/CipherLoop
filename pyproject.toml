[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cipherloop"
version = "0.1.0"
description = "Hybrid LangGraph architecture for context-compressed code auditing."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.0.30",
    "langchain-core>=0.1.40",
    "langchain-anthropic>=0.1.4",
    "langchain-community>=0.0.29",
    "docker>=7.0.0",
    "tree-sitter>=0.21.0",
    "pydantic>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"
